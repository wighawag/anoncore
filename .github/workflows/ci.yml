name: ci

# CI runs the UNIT gate on every push to main and on every pull request, so a
# regression is caught here, not only by a human driving locally.
#
# The single command below IS the repo's acceptance gate, verbatim from
# `.dorfl.json` `verify` (gofmt check + go vet + go build + go test). Keeping it
# byte-for-byte identical means the push/PR gate and the local gate can never
# drift; workflow_test.go pins that (it reads both files and asserts a match), so
# a change to `.dorfl.json` verify fails the build until this workflow is updated
# too.
#
# UNIT ONLY. anoncore's `integration`-tagged tests (real useradd/userdel/setpriv
# behind the injected Runner seam) are deliberately NOT run here: they need root
# on a capable Linux host, which a GitHub-hosted runner does not provide. Run them
# on a capable host with `go test -tags integration ./...`. A green-but-vacuous
# integration run on an incapable runner would be worse than an honest unit-only
# gate, so we do not fake it.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run the .dorfl.json verify gate (unit only)
        # Verbatim from `.dorfl.json` `verify`. Do not edit here without editing
        # .dorfl.json; workflow_test.go enforces the two stay identical.
        run: test -z "$(gofmt -l .)" && go vet ./... && go build ./... && go test ./...
